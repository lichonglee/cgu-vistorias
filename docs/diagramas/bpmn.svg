<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc"><title id="title">BPMN — Funcionamento do CGU Vistorias</title><desc id="desc">Processo de preparação, vistoria, registro local, geração de documento e backup opcional, separado entre usuário e aplicativo.</desc><defs><style>.bg{fill:#f5f8fb}.lane{fill:#fff;stroke:#b8cbd8;stroke-width:2}.lanehead{fill:#e8f3f9}.task{fill:#fff;stroke:#267eaa;stroke-width:2;rx:12}.svc{fill:#e8f7f1;stroke:#07845f;stroke-width:2;rx:12}.gate{fill:#fff5d9;stroke:#d39712;stroke-width:2}.event{fill:#fff;stroke:#07845f;stroke-width:4}.end{fill:#e8f7f1;stroke:#07845f;stroke-width:5}.t{font:14px Arial;fill:#15344c;text-anchor:middle}.h{font:bold 21px Arial;fill:#002543}.laneText{font:bold 17px Arial;fill:#002543}.small{font:12px Arial;fill:#516b7c}.edge{stroke:#456274;stroke-width:2;fill:none;marker-end:url(#arr)}.title{font:bold 28px Arial;fill:#002543}.label{font:bold 12px Arial;fill:#516b7c}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10z" fill="#456274"/></marker></defs><rect class="bg" width="1800" height="1000"/><text class="title" x="40" y="48">CGU Vistorias · BPMN do fluxo de trabalho</text><text class="small" x="40" y="73">Processo local no dispositivo · documentos VT (vistoria técnica), MF (memorial fotográfico) ou RC (consolidado)</text><rect class="lane" x="40" y="100" width="1715" height="530" rx="12"/><rect class="lanehead" x="40" y="100" width="125" height="530" rx="12"/><text class="laneText" transform="translate(115 390) rotate(-90)" text-anchor="middle">USUÁRIO</text><rect class="lane" x="40" y="650" width="1715" height="285" rx="12"/><rect class="lanehead" x="40" y="650" width="125" height="285" rx="12"/><text class="laneText" transform="translate(115 835) rotate(-90)" text-anchor="middle">APLICATIVO</text>
<!-- Primeira linha: preparação e coleta -->
<circle class="event" cx="205" cy="220" r="22"/><text class="small" x="205" y="260" text-anchor="middle">Início</text>
<rect class="task" x="250" y="175" width="150" height="90"/><text class="t" x="325" y="207"><tspan x="325">Configurar unidade</tspan><tspan x="325" dy="20">e responsável</tspan></text>
<path class="gate" d="M450 220l45-45 45 45-45 45z"/><text class="small" x="495" y="315" text-anchor="middle">Edifício existe?</text>
<rect class="task" x="575" y="115" width="150" height="80"/><text class="t" x="650" y="146"><tspan x="650">Cadastrar edifício</tspan><tspan x="650" dy="20">e local</tspan></text>
<rect class="task" x="790" y="175" width="145" height="90"/><text class="t" x="862" y="207"><tspan x="862">Criar</tspan><tspan x="862" dy="20">vistoria</tspan></text>
<rect class="task" x="980" y="175" width="165" height="90"/><text class="t" x="1062" y="201"><tspan x="1062">Preencher dados,</tspan><tspan x="1062" dy="20">objetivo e</tspan><tspan x="1062" dy="20">metodologia</tspan></text>
<rect class="task" x="1190" y="175" width="175" height="90"/><text class="t" x="1277" y="201"><tspan x="1277">Registrar fotos</tspan><tspan x="1277" dy="20">e localização</tspan><tspan x="1277" dy="20">(opcional)</tspan></text>
<rect class="svc" x="1220" y="700" width="175" height="80"/><text class="t" x="1307" y="730"><tspan x="1307">Salvar no IndexedDB</tspan><tspan x="1307" dy="20">do dispositivo</tspan></text>
<path class="gate" d="M1455 220l45-45 45 45-45 45z"/><text class="small" x="1500" y="315" text-anchor="middle">Dados suficientes?</text>
<rect class="task" x="1560" y="115" width="150" height="80"/><text class="t" x="1635" y="146"><tspan x="1635">Completar ou</tspan><tspan x="1635" dy="20">corrigir dados</tspan></text>
<!-- Fluxos principais -->
<path class="edge" d="M227 220H250"/><path class="edge" d="M400 220H450"/><path class="edge" d="M540 220H790"/><text class="label" x="665" y="211">Sim</text><path class="edge" d="M495 175V155H575"/><text class="label" x="515" y="148">Não</text><path class="edge" d="M725 155H755V220H790"/><path class="edge" d="M935 220H980"/><path class="edge" d="M1145 220H1190"/><path class="edge" d="M1365 220H1455"/><path class="edge" d="M1277 265V700"/><path class="edge" d="M1395 740H1430V265H1455"/><path class="edge" d="M1500 175V155H1560"/><text class="label" x="1510" y="148">Não</text><path class="edge" d="M1500 265V350H1277V265"/><text class="label" x="1510" y="340">Sim</text><path class="edge" d="M1635 195V410H1062V265"/>
<!-- Segunda linha do usuário: análise e emissão -->
<rect class="task" x="1410" y="420" width="155" height="85"/><text class="t" x="1487" y="450"><tspan x="1487">Registrar</tspan><tspan x="1487" dy="20">constatações</tspan></text><rect class="task" x="1195" y="420" width="155" height="85"/><text class="t" x="1272" y="450"><tspan x="1272">Revisar conclusão</tspan><tspan x="1272" dy="20">e recomendações</tspan></text><rect class="task" x="980" y="420" width="155" height="85"/><text class="t" x="1057" y="450"><tspan x="1057">Escolher documento</tspan><tspan x="1057" dy="20">VT / MF / RC</tspan></text><rect class="task" x="760" y="420" width="165" height="85"/><text class="t" x="842" y="450"><tspan x="842">Definir rascunho</tspan><tspan x="842" dy="20">ou oficial</tspan></text><path class="edge" d="M1500 265V380H1487V420"/><path class="edge" d="M1410 462H1350"/><path class="edge" d="M1195 462H1135"/><path class="edge" d="M980 462H925"/>
<path class="gate" d="M650 462l45-45 45 45-45 45z"/><text class="small" x="695" y="530" text-anchor="middle">Emissão oficial?</text><path class="edge" d="M760 462H740"/><rect class="svc" x="440" y="420" width="155" height="85"/><text class="t" x="517" y="450"><tspan x="517">Avançar número</tspan><tspan x="517" dy="20">e revisão locais</tspan></text><path class="edge" d="M650 462H595"/><text class="label" x="615" y="452">Sim</text><path class="edge" d="M695 417V385H365V420"/><text class="label" x="670" y="378">Não: rascunho</text><rect class="svc" x="240" y="420" width="125" height="85"/><text class="t" x="302" y="450"><tspan x="302">Montar relatório</tspan><tspan x="302" dy="20">com marca CGU</tspan></text><path class="edge" d="M440 462H365"/><path class="edge" d="M365 462H240"/>
<!-- Aplicativo: geração, download e histórico -->
<rect class="svc" x="240" y="700" width="160" height="80"/><text class="t" x="320" y="730"><tspan x="320">Gerar DOCX</tspan><tspan x="320" dy="20">ou PDF</tspan></text><rect class="task" x="470" y="700" width="155" height="80"/><text class="t" x="547" y="730"><tspan x="547">Baixar arquivo</tspan><tspan x="547" dy="20">para o usuário</tspan></text><rect class="svc" x="695" y="700" width="175" height="80"/><text class="t" x="782" y="730"><tspan x="782">Registrar emissão</tspan><tspan x="782" dy="20">no histórico local</tspan></text><path class="edge" d="M302 505V700"/><path class="edge" d="M400 740H470"/><path class="edge" d="M625 740H695"/><path class="edge" d="M870 740H905V600H950"/>
<rect class="task" x="950" y="560" width="190" height="80"/><text class="t" x="1045" y="590"><tspan x="1045">Exportar backup</tspan><tspan x="1045" dy="20">JSON? (opcional)</tspan></text><path class="edge" d="M1045 640V700"/><rect class="svc" x="950" y="810" width="190" height="75"/><text class="t" x="1045" y="840"><tspan x="1045">Empacotar registros</tspan><tspan x="1045" dy="20">e fotos</tspan></text><path class="edge" d="M1045 780V810"/><path class="edge" d="M1140 600H1680V740"/><text class="label" x="1150" y="590">Não</text><circle class="end" cx="1680" cy="740" r="25"/><text class="small" x="1680" y="790" text-anchor="middle">Fim</text><path class="edge" d="M1140 847H1680V765"/><text class="small" x="40" y="970">A emissão oficial e a sequência são controles locais do aparelho; não equivalem a aprovação ou assinatura institucional. O backup é opcional.</text></svg>
